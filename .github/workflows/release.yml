name: release
# Запуск: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK (платформа 36, build-tools 35)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v5
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета KEYSTORE_BASE64. См. docs/PUBLISHING.md, шаг 1."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION="${GITHUB_REF_NAME#v}"
          CODE=$((100 + GITHUB_RUN_NUMBER))
          ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease \
            -PversionName="$VERSION" -PversionCode="$CODE" --console=plain
      - name: 16 KB page-size check
        run: python3 tools/check_16kb.py app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/folio-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/folio-${GITHUB_REF_NAME}.aab"
          cp app/build/outputs/mapping/release/mapping.txt dist/ 2>/dev/null || true
          (cd dist && sha256sum folio-* > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
