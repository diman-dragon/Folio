name: build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }   # JDK 21, как в Capacitor 8; AGP 8.13 поддерживает 17+
      - name: Android SDK (платформа 36, build-tools 35)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "================ ОШИБКИ (скопируйте этот блок) ================"
            grep -nE "^e: |What went wrong|Execution failed|Could not |error:" -A6 build.log | head -150
            echo "================ ХВОСТ ЛОГА ================"
            tail -40 build.log
          fi
          exit $code
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: 16 KB page-size check (требование Google Play)
        continue-on-error: true
        run: python3 tools/check_16kb.py app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: build-log, path: build.log }
      - uses: actions/upload-artifact@v4
        with:
          name: folio-apk
          path: app/build/outputs/apk/**/*.apk
