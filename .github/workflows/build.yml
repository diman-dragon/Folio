name: build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  release: { types: [published] }
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v5
      - name: Prepare release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug :app:assembleRelease --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "================ ОШИБКИ (скопируйте этот блок) ================"
            grep -nE "^e: |What went wrong|Execution failed|Could not |error:" -A6 build.log | head -150
            echo "================ ХВОСТ ЛОГА ================"
            tail -40 build.log
          fi
          exit $code
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: folio-apk
          path: app/build/outputs/apk/**/*.apk
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
